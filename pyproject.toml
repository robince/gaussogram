[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gaussogram"
version = "0.1.0"
description = "A parsimonious adaptive time-frequency representation (fast Gaussian S-transform / GFT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
demo = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "crates/gaussogram-py/Cargo.toml"
python-source = "python"
module-name = "gaussogram._native"

[tool.uv.extra-build-dependencies]
# nsgt (v0.19) doesn't declare its build deps; supply them so uv can build it.
nsgt = ["numpy", "setuptools", "cython"]

[dependency-groups]
dev = [
    "dtcwt>=0.13.0",
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "nsgt>=0.19",
    "pywavelets>=1.8.0",
    "scipy>=1.15.3",
    "ssqueezepy>=0.6.6",
]
